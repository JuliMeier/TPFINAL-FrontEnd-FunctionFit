<div class="pt-10 pb-16 px-10">

  <!-- Contenedor centrado -->
  <div class="max-w-5xl mx-auto">

    <!-- Título -->
    <div class="mb-14">
      <h1 class="text-4xl font-bold mb-3">
        Bienvenido, <span class="text-yellow-500">{{ user()?.name || user()?.nombre }}</span>
      </h1>
      <p class="text-slate-400 max-w-xl">
        Todo listo para entrenar. Elegí qué querés hacer hoy.
      </p>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

      <!-- Reservar clase -->
      <a
        routerLink="/clases"
        class="group flex items-center justify-between
               rounded-2xl p-8
               h-44 w-full
               bg-slate-800
               border border-slate-700
               text-white shadow-lg
               hover:-translate-y-1 hover:scale-[1.02]
               hover:shadow-yellow-500/20
               transition-all duration-300">

        <div>
          <p class="text-xl font-semibold mb-2">
            Reservar clase
          </p>
          <p class="text-sm text-slate-400">
            Sumá una clase a tu semana
          </p>
        </div>

        <i class="fas fa-plus-circle text-4xl text-yellow-400"></i>
      </a>

      <!-- Historial -->
      <a
        routerLink="/historial"
        class="group flex items-center justify-between
               rounded-2xl p-8
               h-44 w-full
               bg-slate-800
               border border-slate-700
               text-white shadow-lg
               hover:-translate-y-1 hover:scale-[1.02]
               hover:shadow-yellow-500/20
               transition-all duration-300">

        <div>
          <p class="text-xl font-semibold mb-2">
            Ver historial
          </p>
          <p class="text-sm text-slate-400">
            Revisá tu actividad
          </p>
        </div>

        <i class="fas fa-clock text-4xl text-yellow-400"></i>
      </a>

      <!-- Pagar cuota (centrada abajo) -->
      <div class="md:col-span-2 flex justify-center">
        <a
          routerLink="/pagos"
          class="group flex items-center justify-between
                 rounded-2xl p-8
                 h-44 w-full md:w-[48%]
                 bg-yellow-500
                 text-black shadow-lg
                 hover:-translate-y-1 hover:scale-[1.02]
                 hover:shadow-yellow-500/40
                 transition-all duration-300">

          <div>
            <p class="text-xl font-semibold mb-2">
              Pagar cuota
            </p>
            <p class="text-sm">
              Mantené tu membresía activa
            </p>
          </div>

          <i class="fas fa-credit-card text-4xl"></i>
        </a>
      </div>

    </div>
  </div>
</div>
