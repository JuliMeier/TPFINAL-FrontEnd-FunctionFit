<div class="pt-10 pb-16 px-10">

  <!-- Contenedor centrado -->
  <div class="max-w-5xl mx-auto">

    <!-- Título -->
    <div class="mb-14">
      <h1 class="text-4xl font-bold mb-3">
        Bienvenido, <span class="text-yellow-500">Super Administrador</span>
      </h1>
      <p class="text-slate-400 max-w-xl">
        Accedé a las herramientas para gestionar tu gimnasio.
      </p>
    </div>

    <!-- Grid 2x2 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

      @for (card of cardData; track card.pathname) {
        <a
          routerLink="{{ card.pathname }}"
          class="group flex items-center justify-between
                 rounded-2xl p-8
                 h-44 w-full
                 bg-slate-800
                 border border-slate-700
                 text-white shadow-lg
                 hover:-translate-y-1 hover:scale-[1.02]
                 hover:shadow-yellow-500/20
                 transition-all duration-300">

          <div>
            <p class="text-xl font-semibold mb-2">
              {{ card.title }}
            </p>
            <p class="text-sm text-slate-400">
              {{ card.text }}
            </p>
          </div>

          <i class="{{ card.icon }} text-4xl text-yellow-400"></i>
        </a>
      }

    </div>
  </div>
</div>
