<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-4">
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Nombre -->
    <div>
      <label class="block text-sm font-medium text-zinc-400 mb-1">Nombre</label>
      <input formControlName="nombre" type="text" class="input-field w-full">
    </div>

    <!-- Apellido -->
    <div>
      <label class="block text-sm font-medium text-zinc-400 mb-1">Apellido</label>
      <input formControlName="apellido" type="text" class="input-field w-full">
    </div>
  </div>

  <!-- Email -->
  <div>
    <label class="block text-sm font-medium text-zinc-400 mb-1">Correo Electrónico</label>
    <input formControlName="email" type="email" class="input-field w-full">
    @if (userForm.get('email')?.invalid && userForm.get('email')?.touched) {
      <span class="text-red-500 text-xs">Email no válido</span>
    }
  </div>

  <!-- Teléfono -->
  <div>
    <label class="block text-sm font-medium text-zinc-400 mb-1">Teléfono</label>
    <input formControlName="telefono" type="text" class="input-field w-full">
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Rol -->
    <div>
      <label class="block text-sm font-medium text-zinc-400 mb-1">Rol de Acceso</label>
      <select formControlName="roleId" class="input-field w-full">
        <option [value]="1">Socio</option>
        <option [value]="2">Administrador</option>
        <option [value]="3">Super Admin</option>
      </select>
    </div>


    <!-- Contraseña -->
    <div>
      <label class="block text-sm font-medium text-zinc-400 mb-1">Contraseña</label>
      <input formControlName="contraseña" type="password" class="input-field w-full">
    </div>
  </div>

  <!-- Botones -->
  <div class="pt-4 flex justify-end gap-3">
    <button type="button" (click)="onClose.emit()"
      class="px-4 py-2 text-zinc-400 hover:text-white transition">
      Cancelar
    </button>
    <button type="submit" [disabled]="userForm.invalid"
      class="btn-primary px-6 py-2.5 font-semibold disabled:opacity-50
             transition-all duration-200
             hover:bg-yellow-400 hover:text-slate-900
             hover:shadow-lg hover:shadow-yellow-500/30">
      Guardar Usuario
    </button>
  </div>

</form>
