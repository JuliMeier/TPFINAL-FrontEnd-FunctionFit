<div class="space-y-8 px-4">

  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <h1 class="text-3xl font-bold">Gestión de Planes</h1>
  </div>

  <!-- Tabla -->
  <div class="glass-card overflow-hidden">
    <table class="w-full text-left border-collapse text-base">

      <thead class="bg-slate-800">
        <tr>
          <th class="p-6 text-yellow-400 text-lg font-semibold">ID</th>
          <th class="p-6 text-yellow-400 text-lg font-semibold">Tipo</th>
          <th class="p-6 text-yellow-400 text-lg font-semibold">Precio</th>
          <th class="p-6 text-yellow-400 text-lg font-semibold text-right">Acciones</th>
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-800">
        @for (plan of plans(); track plan.id) {
          <tr class="hover:bg-slate-800/30 transition-colors duration-200">
            <td class="p-6">{{ plan.id }}</td>
            <td class="p-6">
              <span class="px-3 py-1.5 rounded text-sm font-semibold
                          bg-yellow-400/20 text-slate-800
                          transition-all duration-200
                          hover:bg-yellow-400
                          hover:text-slate-900
                          hover:shadow-md
                          hover:shadow-yellow-500/30
                          cursor-default">
                {{ plan.tipo === 1 ? 'Basic' : plan.tipo === 2 ? 'Premium' : 'Elite' }}
              </span>
            <td class="p-6">{{ plan.precio | currency:'USD' }}</td>
            <td class="p-6 text-right">
              <button (click)="editPlan(plan.id)"
                class="text-slate-800 hover:text-yellow-400 font-medium text-base transition-colors duration-200">
                Editar
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="p-16 text-center text-slate-500 italic text-lg">
              No hay planes disponibles.
            </td>
          </tr>
        }
      </tbody>

    </table>
  </div>

  <!-- Modal Editar Plan -->
  @if (selectedPlan()) {
  <div class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm z-50">
    <div class="w-full max-w-md p-8 relative rounded-2xl
                bg-blue-500/10
                border border-blue-400/30
                backdrop-blur-xl
                shadow-2xl shadow-blue-500/20">

      <button (click)="selectedPlan.set(null)"
        class="absolute top-4 right-4 text-zinc-400 hover:text-white text-sm">
        ✕
      </button>

      <h2 class="text-2xl font-bold text-white mb-6">Editar Plan</h2>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-zinc-400 mb-1">Tipo</label>
          <input [(ngModel)]="selectedPlan()!.tipo" class="input-field w-full" />
        </div>
        <div>
          <label class="block text-sm font-medium text-zinc-400 mb-1">Precio</label>
          <input [(ngModel)]="selectedPlan()!.precio" type="number" class="input-field w-full" />
        </div>
      </div>

      <div class="pt-4 flex justify-end gap-3">
        <button (click)="selectedPlan.set(null)"
          class="px-4 py-2 text-zinc-400 hover:text-white transition">
          Cancelar
        </button>
        <button (click)="savePlan()"
          class="btn-primary px-6 py-2.5 font-semibold
                 transition-all duration-200
                 hover:bg-yellow-400 hover:text-slate-900
                 hover:shadow-lg hover:shadow-yellow-500/30">
          Guardar
        </button>
      </div>

    </div>
  </div>
  }

</div>
